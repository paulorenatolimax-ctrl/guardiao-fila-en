name: Publicar carrossel (conta em inglês)
on:
  schedule:
    - cron: '*/10 10-23 * * *'
    - cron: '*/10 0-2 * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar agora mesmo, sem regra de horário?"
        type: boolean
        default: false
concurrency:
  group: publicar-carrossel-en
  cancel-in-progress: false
jobs:
  carrossel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 publicar_carrossel.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCAR: ${{ github.event.inputs.forcar }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      - run: |
          git config user.name "fila-guardiao-en"; git config user.email "actions@github.com"
          git add carrosseis.json
          git diff --staged --quiet && exit 0
          git commit -m "carrossel EN publicado: $(date -u +%d/%m %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
